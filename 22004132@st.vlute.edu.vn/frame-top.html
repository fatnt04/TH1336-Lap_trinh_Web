<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body{ font-family: "Times New Roman", Georgia, serif; margin:10px; overflow:auto; font-size:14px; }
    h3{ margin:0 0 8px 0; font-size:18px; font-weight:bold; }
    .cols{ display:flex; }
    .col{ width:50%; padding:6px; box-sizing:border-box; }
    .col ul{ text-align:left; margin-left:18px; }
    .col small{ color:#444; display:block; margin-top:4px; }
  </style>
</head>
<body>
  <h3>Học Web Design</h3>
  <div class="cols">
    <div class="col">
      <strong>Front-End</strong>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </div>
    <div class="col">
      <strong>Back-end</strong>
      <ul>
        <li>Server-side Language: PHP, Python, ASP.NET, Java,...</li>
        <li>Database Management System: MySQL, Oracle, SQL Server, DB2,...</li>
        <li>PHP Framework: Zend, Laravel,...</li>
      </ul>
    </div>
  </div>
</body>
</html>
