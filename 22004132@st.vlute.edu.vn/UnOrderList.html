<!DOCTYPE html>

<body>
    <h1>Danh sách không có thứ tự</h1>
    <div>
        <p><b>Danh sách với bullet là các chấm tròn đen</b></p>
        <ul style="list-style-type: disc;">
            <li>Táo</li>
            <li>Cam</li>
            <li>Chanh</li>
        </ul>
    </div>
    <div>
        <p><b>Danh sách với bullet là các đường tròn rỗng</b></p>
        <ul style="list-style-type: Circle;">
            <li>Táo</li>
            <li>Cam</li>
            <li>Chanh</li>
        </ul>
    </div>
    <div>
        <p><b>Danh sách với bullet là các hình vuông nhỏ màu đen</b></p>
        <ul style="list-style-type: Square;">
            <li>Táo</li>
            <li>Cam</li>
            <li>Chanh</li>
        </ul>
    </div>
