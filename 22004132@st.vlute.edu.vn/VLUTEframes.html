<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VLUTE Frames</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .row {
      display: flex;
      width: 100%;
      height: 300px; /* Chiều cao hàng trên */
    }
    .row iframe {
      width: 50%;
      height: 100%;
      border: 1px solid #000;
    }
    .bottom {
      width: 100%;
      height: 250px; /* Chiều cao hàng dưới */
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <div class="row">
    <iframe src="VLUTE.html" name="left"></iframe>
    <iframe src="GioiThieu.html" name="right"></iframe>
  </div>
  <iframe src="MeKong.html" class="bottom" name="bottom"></iframe>
</body>
</html>
