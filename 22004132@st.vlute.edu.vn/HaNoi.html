<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Các món ngon Hà Nội</title>
<style>
  body {
    margin: 0;
    background-color: #f9f3d2;
    font-family: "Times New Roman", serif;
  }
  .container {
    width: 540px; /* độ rộng gần bằng hình */
    padding: 10px;
    margin: 20px auto;
    background-color: #f9f3d2;
    display: flex;
    gap: 20px;
    overflow-y: scroll; /* để có thanh cuộn dọc */
    height: 240px; /* chiều cao gần đúng để hiện thanh cuộn */
  }
  .image {
    width: 100px;
    height: auto;
  }
  .content {
    flex-grow: 1;
  }
  h2 {
    color: #c46900;
    font-weight: bold;
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 10px;
    text-align: center;
    font-family: "Times New Roman", serif;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th {
    background-color: #c46900;
    color: white;
    padding: 6px 10px;
    border: 1px solid #c46900;
    font-size: 14px;
  }
  td {
    border: 1px solid #c46900;
    padding: 6px 10px;
    font-size: 14px;
  }
  tbody tr:nth-child(odd) {
    background-color: #ffe6b3;
  }
  tbody tr:nth-child(even) {
    background-color: white;
  }
</style>
</head>
<body>
  <div class="container">
    <img class="image" src="HaNoi.PNG" alt="Bát và hạt cà phê" />
    <div class="content">
      <h2>Các món ngon Hà Nội</h2>
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Tên món ăn</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>1.</td><td>Bánh cuốn Thanh Trì</td></tr>
          <tr><td>2.</td><td>Xôi Hà Nội</td></tr>
          <tr><td>3.</td><td>Chả cá Lã Vọng</td></tr>
          <tr><td>4.</td><td>Cháo Cóc</td></tr>
          <tr><td>5.</td><td>Bánh Gai Ninh Giang</td></tr>
          <tr><td>6.</td><td>Bún Thang Hà Nội</td></tr>
          <tr><td>7.</td><td>Canh Lăng</td></tr>
          <tr><td>8.</td><td>Vịt quay lạng Sơn</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
